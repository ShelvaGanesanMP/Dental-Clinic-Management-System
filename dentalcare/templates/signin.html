<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("{% static 'images/signin_up_background.png' %}");
        background-size: cover;
        /*background-color: #e0f7fa;*/
        padding: 30px;
      }
      .container {
        max-width: 400px;
        width: 100%;
        background: #ffffff;
        padding: 40px 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      .title {
        font-size: 24px;
        font-weight: 500;
        color: #00796b;
        margin-bottom: 10px;
        text-align: center;
      }
      .input-box {
        position: relative;
        width: 100%;
        margin: 10px 0;
      }
      .input-box input {
        width: 100%;
        height: 50px;
        padding: 0 30px;
        border: 2px solid #80cbc4;
        outline: none;
        border-radius: 6px;
        font-size: 16px;
        transition: all 0.3s ease;
      }
      .input-box input:focus,
      .input-box input:valid {
        border-color: #00796b;
      }
      .input-box i {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 17px;
        color: #00796b;
      }
      .button input {
        width: 100%;
        height: 50px;
        border: none;
        background: #00796b;
        color: white;
        font-size: 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.4s ease;
      }
      .button input:hover {
        background: #004d40;
      }
      .text {
        font-size: 14px;
        margin-top: 20px;
        text-align: center;
      }
      .text a {
        color: #00796b;
        text-decoration: none;
      }
      .text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
  <div class="container">
    <div class="title">Sign In</div>
    <form action="{% url 'signin' %}" method="POST">
      {% csrf_token %}
      <div class="input-box">
        <i class="fas fa-user"></i>
        <input type="text" name="name" placeholder="Enter your name" required>
      </div>
      <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="button">
        <input type="submit" value="Submit">
      </div>
    </form>
    
    {% if messages %}
      {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
      {% endfor %}
    {% endif %}    
  </div>
</body>
</html>
